<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F1D1A">
<title>MTH Live</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/live/manifest.webmanifest">
<link rel="icon" href="/live/icon-192.png">
<link rel="apple-touch-icon" href="/live/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1F1D1A;--card:#2A2723;--card2:#332F2A;--line:#3D3832;--cream:#F3ECE0;--dim:#A99F90;--terra:#C9734F;--sage:#8DAE97;--gold:#E2B65A;--red:#D9584A;--ig:#D9739A;--fb:#6E9BD6;--yt:#E06A55}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--cream);font:16px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
header h1 span{color:var(--terra)}
.sp{flex:1}
.fresh{font-size:12px;color:var(--dim);text-align:right;line-height:1.3}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sage);margin-right:5px;vertical-align:1px}
.dot.stale{background:var(--gold)}
button{font:inherit;color:var(--cream);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600}
button:active{transform:scale(.97)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.label{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin-top:4px}
.big.terra{color:var(--terra)}
.sub{font-size:13px;color:var(--dim);margin-top:2px}
h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center}
h2 small{margin-left:auto;font-weight:500;color:var(--dim);font-size:12px}
.plats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plat{background:var(--card2);border-radius:14px;padding:12px 10px}
.plat b{display:block;font-size:24px;font-weight:800;margin-top:2px}
.plat em{font-style:normal;font-size:12px;color:var(--sage);font-weight:600}
.pn{font-size:12px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rname{width:96px;font-size:14px;font-weight:600}
.bar{flex:1;height:10px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--terra);border-radius:6px}
.rnum{width:64px;text-align:right;font-weight:700;font-size:15px}
.rgain{width:52px;text-align:right;font-size:12px;color:var(--sage);font-weight:600}
svg text{fill:var(--dim);font:11px Inter,sans-serif}
.post{display:block;text-decoration:none;color:inherit;padding:11px 0;border-top:1px solid var(--line)}
.post:first-of-type{border-top:0}
.ptitle{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:12px;color:var(--dim)}
.pv{margin-left:auto;font-size:18px;font-weight:800;color:var(--cream)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--card2)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:7px 4px;font-size:13px}
.tabs button.on{background:var(--terra);border-color:var(--terra);color:#fff}
.msg{text-align:center;padding:28px 16px;color:var(--dim)}
.msg b{display:block;color:var(--cream);font-size:17px;margin-bottom:6px}
.msg button{margin-top:14px;background:var(--terra);border-color:var(--terra);color:#fff}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.today div{background:var(--card2);border-radius:14px;padding:10px 4px}
.today b{display:block;font-size:22px;font-weight:800}
.err{font-size:13px;color:var(--gold);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>MTH <span>Live</span></h1>
  <div class="sp"></div>
  <div class="fresh" id="fresh">Loading…</div>
  <button id="refresh" aria-label="Refresh">↻</button>
</header>
<div id="app"><div class="card msg"><b>Loading your numbers…</b>Connecting to your Supabase.</div></div>

<script>
const API = "https://oihefcsonqjeicelezln.supabase.co/functions/v1/mth-command";
let KEY = null;
try { const m = location.hash.match(/k=([A-Za-z0-9-]+)/); if (m) { localStorage.setItem("mthLiveKey", m[1]); history.replaceState(null, "", location.pathname); } KEY = localStorage.getItem("mthLiveKey"); } catch (e) {}
const ACC = {"gut-health":"Gut Health","heart-disease":"Heart","diabetes":"Diabetes","weight-loss":"Weight Loss","cancer":"Cancer","main":"Main"};
const PL = {instagram:["Instagram","var(--ig)"],facebook:["Facebook","var(--fb)"],youtube:["YouTube","var(--yt)"]};
const $ = (s) => document.querySelector(s);
const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e4 ? (n/1e3).toFixed(1)+"K" : Math.round(n).toLocaleString();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA = null, STORED = null, RANGE = "7", mcp = null, unsub = null;

function shape(r) {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0); const t1 = t0.getTime() + 864e5;
  return {
    items: r.items.map((i) => ({ id: i.id, pl: i.platform, ac: i.account, k: i.kind, t: (i.title || "").slice(0, 140), at: i.posted_at, v: i.views || 0, w: i.avg_watch_sec, u: i.permalink })),
    snaps: r.snaps.map((s) => [s.item_id, Date.parse(s.captured_at), s.views || 0]),
    posts: r.posts.filter((p) => { const t = Date.parse(p.publish_at); return t >= t0.getTime() && t < t1; }).map((p) => ({ s: p.status, at: p.publish_at, ac: p.account })),
    collected: r.collected_at, now: r.now };
}
function compute(d) {
  const now = Date.parse(d.now), day = 864e5;
  const byItem = new Map(d.items.map((i) => [i.id, i]));
  // views gained per hour (last 48h) from snapshot differences
  const last = new Map(), hours = new Array(48).fill(0), gain24 = new Map();
  for (const [id, t, v] of d.snaps) {
    const it = byItem.get(id); let prev = last.get(id);
    if (prev === undefined) { prev = (it && Date.parse(it.at) > now - 3 * day) ? 0 : null; }
    last.set(id, v);
    if (prev === null) continue;
    const g = Math.max(0, v - prev); if (!g) continue;
    const h = Math.floor((now - t) / 36e5); if (h >= 0 && h < 48) hours[47 - h] += g;
    if (t > now - day) gain24.set(id, (gain24.get(id) || 0) + g);
  }
  const g24 = (pred) => d.items.filter(pred).reduce((s, i) => s + (gain24.get(i.id) || 0), 0);
  const inRange = (i) => RANGE === "all" || Date.parse(i.at) > now - Number(RANGE) * day;
  const items = d.items.filter(inRange);
  const total = items.reduce((s, i) => s + i.v, 0);
  const plats = Object.keys(PL).map((k) => ({ k, v: items.filter((i) => i.pl === k).reduce((s, i) => s + i.v, 0), g: g24((i) => i.pl === k) }));
  const accs = Object.keys(ACC).map((k) => ({ k, v: items.filter((i) => i.ac === k).reduce((s, i) => s + i.v, 0), g: g24((i) => i.ac === k), n: items.filter((i) => i.ac === k).length }));
  const top = [...items].sort((a, b) => b.v - a.v).slice(0, 10);
  const recent = [...d.items].sort((a, b) => Date.parse(b.at) - Date.parse(a.at)).slice(0, 8);
  const posted = d.posts.filter((p) => p.s === "posted").length, sched = d.posts.filter((p) => p.s === "scheduled").length;
  return { total, gainDay: [...gain24.values()].reduce((a, b) => a + b, 0), hours, plats, accs, top, recent, posted, sched, count: items.length, gain24, now };
}

function chart(hours) {
  const W = 520, H = 120, max = Math.max(1, ...hours), bw = W / hours.length;
  const bars = hours.map((v, i) => { const h = Math.max(v ? 3 : 1, (v / max) * (H - 22)); return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - 16 - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${i >= 24 ? "#C9734F" : "#5A4A3E"}"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Views gained per hour, last 48 hours">${bars}<text x="0" y="${H - 2}">48h ago</text><text x="${W / 2}" y="${H - 2}" text-anchor="middle">24h ago</text><text x="${W}" y="${H - 2}" text-anchor="end">now</text><text x="${W}" y="11" text-anchor="end">peak ${fmt(max)}/hr</text></svg>`;
}

const ago = (ms) => { const m = Math.round(ms / 6e4); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };
const postRow = (i, c) => `<a class="post" href="${esc(i.u || "#")}" target="_blank" rel="noopener"><div class="ptitle">${esc(i.t || "(no caption)")}</div><div class="pmeta"><span class="tag" style="color:${PL[i.pl]?.[1] || "var(--dim)"}">${PL[i.pl]?.[0] || i.pl}</span><span>${ACC[i.ac] || i.ac || ""}</span><span>${ago(c.now - Date.parse(i.at))}</span>${c.gain24.get(i.id) ? `<span style="color:var(--sage);font-weight:600">+${fmt(c.gain24.get(i.id))} today</span>` : ""}<span class="pv">${fmt(i.v)}</span></div></a>`;

function render() {
  if (!DATA) return;
  const c = compute(DATA), maxA = Math.max(1, ...c.accs.map((a) => a.v));
  const rl = { "1": "24 hours", "7": "7 days", "30": "30 days", "all": "60 days" }[RANGE];
  $("#app").innerHTML = `
  <div class="tabs">${["1", "7", "30", "all"].map((r) => `<button data-r="${r}" class="${r === RANGE ? "on" : ""}">${{ "1": "Today", "7": "7 days", "30": "30 days", "all": "All" }[r]}</button>`).join("")}</div>
  <div class="card hero">
    <div><div class="label">Views gained, 24 h</div><div class="big terra">${fmt(c.gainDay)}</div><div class="sub">across every account</div></div>
    <div><div class="label">Total views</div><div class="big">${fmt(c.total)}</div><div class="sub">${c.count} posts · ${rl}</div></div>
  </div>
  <div class="card"><h2>Views per hour<small>last 48 h</small></h2>${chart(c.hours)}</div>
  <div class="card"><h2>Platforms<small>${rl}</small></h2><div class="plats">${c.plats.map((p) => `<div class="plat"><div class="pn" style="color:${PL[p.k][1]}">${PL[p.k][0]}</div><b>${fmt(p.v)}</b><em>${p.g ? "+" + fmt(p.g) + " today" : "&nbsp;"}</em></div>`).join("")}</div></div>
  <div class="card"><h2>Accounts<small>views · today</small></h2>${c.accs.map((a) => `<div class="row"><div class="rname">${ACC[a.k]}</div><div class="bar"><i style="width:${(a.v / maxA * 100).toFixed(1)}%"></i></div><div class="rnum">${fmt(a.v)}</div><div class="rgain">${a.g ? "+" + fmt(a.g) : ""}</div></div>`).join("")}</div>
  <div class="card"><h2>Today's posting</h2><div class="today"><div><b>${c.posted}</b><span class="sub">posted</span></div><div><b>${c.sched}</b><span class="sub">still to go</span></div><div><b>${c.posted + c.sched}</b><span class="sub">total today</span></div></div></div>
  <div class="card"><h2>Top posts<small>${rl}</small></h2>${c.top.length ? c.top.map((i) => postRow(i, c)).join("") : '<div class="sub">No posts in this range yet.</div>'}</div>
  <div class="card"><h2>Latest posts</h2>${c.recent.map((i) => postRow(i, c)).join("")}</div>`;
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { RANGE = b.dataset.r; try { localStorage.setItem("mthRange", RANGE); } catch (e) {} render(); });
  const col = DATA.collected ? Date.parse(DATA.collected) : null, st = STORED || Date.parse(DATA.now);
  $("#fresh").innerHTML = `<span class="dot ${Date.now() - st > 15 * 6e4 ? "stale" : ""}"></span>Updated ${ago(Date.now() - st)}${col ? `<br>Stats pulled ${ago(Date.now() - col)}` : ""}`;
}

function showMsg(title, text) {
  if (DATA) { $("#fresh").innerHTML = `<span class="dot stale"></span>${esc(title)}`; return; }
  $("#app").innerHTML = `<div class="card msg"><b>${esc(title)}</b>${esc(text)}</div>`;
}
let busy = false;
async function load() {
  if (!KEY) return showMsg("Open your setup link once", "Open the MTH Live setup link Claude gave you on this phone. After that, this app remembers it.");
  if (busy) return; busy = true; $("#fresh").textContent = "Refreshing…";
  try {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-mth-command": KEY }, body: JSON.stringify({ action: "phone" }) });
    if (r.status === 403) { showMsg("This phone isn't set up", "Open the MTH Live setup link again."); return; }
    const j = await r.json(); if (!r.ok || j.error) throw new Error(j.message || j.error || r.status);
    DATA = shape(j); STORED = Date.now(); render();
    try { localStorage.setItem("mthLiveCache", JSON.stringify(DATA)); } catch (e) {}
  } catch (e) { showMsg("Can't reach your stats right now", "No connection or the server is busy. It'll try again shortly."); }
  finally { busy = false; }
}
$("#refresh").onclick = load;
try { RANGE = localStorage.getItem("mthRange") || "7"; const c = localStorage.getItem("mthLiveCache"); if (c) { DATA = JSON.parse(c); STORED = null; render(); $("#fresh").innerHTML = '<span class="dot stale"></span>Showing last numbers…'; } } catch (e) {}
load();
setInterval(load, 120e3);
setInterval(() => DATA && STORED && render(), 30e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/live/sw.js", { scope: "/live/" }).catch(() => {});
</script>
</body>
</html>
